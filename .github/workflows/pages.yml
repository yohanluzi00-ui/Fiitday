# Publie la version web (dossier dist/) sur GitHub Pages à chaque modification (actions épinglées sur une empreinte fixe).
name: Publier la version web
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'supabase/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Numéro de version (nombre de modifications du code)
        run: |
          n=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$n" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$n" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Construire
        run: node build.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
