plugins {
    id 'com.android.application'
}

// Numéro de version fourni par GitHub Actions (numéro du build)
def vCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
def vName = System.getenv("VERSION_NAME") ?: "1.0-dev"

android {
    namespace 'com.fiitday.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fiitday.app'
        minSdk 24
        targetSdk 36
        versionCode vCode
        versionName vName
        manifestPlaceholders = [appLabel: 'Fiitday']
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'muscuapp'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    def rcTestKey = '"' + (System.getenv('RC_TEST_KEY') ?: project.findProperty('fiitdayRcTestKey') ?: '').replaceAll('[^A-Za-z0-9_]', '') + '"'
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        // appli « Fiitday Test » : installée à côté de la vraie, achats factices du magasin de test RevenueCat.
        // Compilée comme la vraie (pas « débogable » : sa page et ses fichiers ne sont pas lisibles par câble USB).
        // La clé du magasin de test est publique (elle est dans l'appli) : gradle.properties (fiitdayRcTestKey),
        // ou la variable d'environnement RC_TEST_KEY si elle est remplie.
        staging {
            initWith release
            debuggable false
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            matchingFallbacks = ['release']
            manifestPlaceholders = [appLabel: 'Fiitday Test']
            buildConfigField 'String', 'RC_KEY', rcTestKey
            // même signature d'une version à l'autre (mises à jour sans désinstaller), si la clé de signature est là
            signingConfig file('../release.p12').exists() && System.getenv('KEYSTORE_PASSWORD') ? signingConfigs.release : signingConfigs.debug
        }
        // développement sur un ordinateur seulement (jamais publiée)
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: 'Fiitday Dev']
            buildConfigField 'String', 'RC_KEY', rcTestKey
        }
    }

    // la classe Billing branchée sur RevenueCat sert à l'appli de test et à la version de développement
    sourceSets {
        staging.java.srcDirs += 'src/testapp/java'
        debug.java.srcDirs += 'src/testapp/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // achats RevenueCat : dans l'appli de test seulement, jusqu'au branchement du paiement Google
    stagingImplementation 'com.revenuecat.purchases:purchases:11.4.3'
    debugImplementation 'com.revenuecat.purchases:purchases:11.4.3'
}
